<title>Team Operations Woensdag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=Epilogue:wght@400;500;600;700&display=swap">
<style>
/* Layout: black masthead with the Coalition:58 wordmark, a sticky tab rail, then "zwevende blokken":
   floating cards on a warm-grey ground that expand in place to reveal their layers (OKR → KR → actie). */
:root{
  --bg:#F1F1EE; --surface:#FFFFFF; --surface-2:#F7F7F4; --fg:#141414; --muted:#6B6B66;
  --line:#E2E2DD; --line-strong:#C6C6C0; --accent:#DD0000; --accent-ink:#FFFFFF; --accent-soft:#FBE9E9;
  --head:#0F0F0F; --head-fg:#FFFFFF; --head-muted:#9A9A95;
  --good:#1E7A3C; --good-bg:#E4F2E8; --warn:#A8640A; --warn-bg:#FBF0D9; --bad:#B4261E; --bad-bg:#FBE5E3;
  --neutral:#6B6B66; --neutral-bg:#ECECE8; --busy:#1F4E9A; --busy-bg:#E3ECFA;
  --shadow:0 1px 2px rgba(20,20,20,.05),0 10px 28px -14px rgba(20,20,20,.22);
  --shadow-lift:0 2px 4px rgba(20,20,20,.06),0 18px 40px -16px rgba(20,20,20,.28);
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Epilogue','Helvetica Neue',Helvetica,Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131313; --surface:#1D1D1C; --surface-2:#252524; --fg:#F1F1EE; --muted:#A4A49E;
    --line:#2F2F2D; --line-strong:#474744; --accent:#F0302A; --accent-ink:#FFFFFF; --accent-soft:#3A1715;
    --head:#000000; --head-fg:#FFFFFF; --head-muted:#8A8A85;
    --good:#62C784; --good-bg:#17341F; --warn:#E6A93F; --warn-bg:#3A2A0C; --bad:#F26B61; --bad-bg:#3F1715;
    --neutral:#A4A49E; --neutral-bg:#2B2B29; --busy:#7FA8EE; --busy-bg:#1A2A45;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
    --shadow-lift:0 2px 4px rgba(0,0,0,.5),0 18px 40px -16px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131313; --surface:#1D1D1C; --surface-2:#252524; --fg:#F1F1EE; --muted:#A4A49E;
  --line:#2F2F2D; --line-strong:#474744; --accent:#F0302A; --accent-ink:#FFFFFF; --accent-soft:#3A1715;
  --head:#000000; --head-fg:#FFFFFF; --head-muted:#8A8A85;
  --good:#62C784; --good-bg:#17341F; --warn:#E6A93F; --warn-bg:#3A2A0C; --bad:#F26B61; --bad-bg:#3F1715;
  --neutral:#A4A49E; --neutral-bg:#2B2B29; --busy:#7FA8EE; --busy-bg:#1A2A45;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  --shadow-lift:0 2px 4px rgba(0,0,0,.5),0 18px 40px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--display);text-transform:uppercase;letter-spacing:.01em;line-height:1;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* masthead */
.mast{background:var(--head);color:var(--head-fg)}
.mast-in{max-width:1180px;margin:0 auto;padding:14px 16px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.wordmark{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:.02em;text-transform:uppercase;line-height:.9}
.wordmark b{color:var(--accent);font-weight:800}
.brand small{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--head-muted)}
.mast-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--head-muted)}
.mast-right .chip{border-color:#333}
.rule{height:3px;background:var(--accent)}

/* tab rail */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.rail-in{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.rail-in::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 10px 9px;font-family:var(--display);font-weight:700;font-size:15.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .cnt{font-family:var(--body);font-weight:600;font-size:11px;color:var(--muted);margin-left:5px;vertical-align:2px}

/* page */
.page{max-width:1180px;margin:0 auto;padding-block:22px 64px;padding-inline:16px}
.sec{display:flex;flex-direction:column;gap:14px;margin-bottom:28px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:28px;font-weight:800}
.sec-head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.eyebrow{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* cards (the floating blocks) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;align-items:start}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid transparent;min-width:0;transition:box-shadow .18s,transform .18s}
.card.open{grid-column:1/-1;box-shadow:var(--shadow-lift)}
.card-h{display:flex;gap:14px;padding:16px 16px 14px;cursor:pointer;align-items:flex-start;border-radius:var(--r)}
.card-h:hover{background:var(--surface-2)}
.card.open>.card-h{border-bottom:1px solid var(--line);border-radius:var(--r) var(--r) 0 0}
.code{font-family:var(--display);font-weight:800;font-size:40px;line-height:.85;color:var(--accent);min-width:54px;letter-spacing:.01em}
.code.sm{font-size:22px;min-width:auto;color:var(--fg)}
.card-t{flex:1;min-width:0}
.card-t h3{font-size:22px;font-weight:700;text-transform:none;font-family:var(--body);letter-spacing:0;line-height:1.25}
.card-t h3.disp{font-family:var(--display);text-transform:uppercase;font-size:26px;letter-spacing:.01em}
.card-t p{margin:6px 0 0;color:var(--muted);font-size:13px}
.card-b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.chev{width:22px;height:22px;flex:none;color:var(--muted);transition:transform .18s;margin-top:4px}
.open>.card-h .chev{transform:rotate(90deg)}
.meta{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.meta b{color:var(--fg);font-weight:600}
.stripe{border-left:5px solid var(--neutral)}
.stripe.good{border-left-color:var(--good)}.stripe.warn{border-left-color:var(--warn)}.stripe.bad{border-left-color:var(--bad)}

/* nested layers */
.layer{border-left:2px solid var(--line-strong);margin-left:6px;padding-left:12px;display:flex;flex-direction:column;gap:8px}
.layer-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.layer-h .eyebrow{color:var(--muted)}
.row{background:var(--surface-2);border-radius:8px;border:1px solid var(--line)}
.row-h{display:flex;gap:12px;align-items:center;padding:10px 12px;cursor:pointer;flex-wrap:wrap}
.row-h:hover{border-color:var(--line-strong)}
.row-h .t{flex:1;min-width:200px;font-weight:500}
.row.open .row-h{border-bottom:1px solid var(--line)}
.row-b{padding:12px;display:flex;flex-direction:column;gap:12px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 18px;font-size:13px}
.kv div span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:2px}
.qgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:520px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px}
.q.cur{border-color:var(--accent)}
.q b{display:block;font-family:var(--display);font-size:15px;letter-spacing:.08em}
.q small{color:var(--muted)}
.acties{display:flex;flex-direction:column;gap:6px}
.actie{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:6px;flex-wrap:wrap}
.actie .t{flex:1;min-width:180px}
.actie .t small{display:block;color:var(--muted);font-size:12px}
.actie.done .t{color:var(--muted);text-decoration:line-through}
.empty{padding:18px;border:1px dashed var(--line-strong);border-radius:var(--r);color:var(--muted);text-align:center;font-size:13px;grid-column:1/-1}
.empty b{display:block;font-family:var(--display);text-transform:uppercase;font-size:20px;color:var(--fg);margin-bottom:4px}

/* pills, chips, meters */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 7px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap;border:1px solid var(--line-strong);background:var(--neutral-bg);color:var(--fg)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--neutral);flex:none}
.pill.good{background:var(--good-bg);border-color:transparent;color:var(--good)}.pill.good i{background:var(--good)}
.pill.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}.pill.warn i{background:var(--warn)}
.pill.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad)}.pill.bad i{background:var(--bad)}
.pill.busy{background:var(--busy-bg);border-color:transparent;color:var(--busy)}.pill.busy i{background:var(--busy)}
.pill.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent)}.pill.accent i{background:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:5px;font-size:11.5px;border:1px solid var(--line-strong);color:var(--muted);white-space:nowrap;max-width:100%}
.chip.link{cursor:pointer}.chip.link:hover{color:var(--fg);border-color:var(--fg)}
.chip.theme{font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--fg)}
.chip.theme.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.flag{border-color:var(--warn);color:var(--warn)}
.meter{display:flex;align-items:center;gap:8px;min-width:120px;max-width:340px;flex:1}
.meter .bar{flex:1;height:6px;border-radius:4px;background:var(--neutral-bg);overflow:hidden}
.meter .bar span{display:block;height:100%;border-radius:4px;background:var(--fg)}
.meter.good .bar span{background:var(--good)}.meter.warn .bar span{background:var(--warn)}.meter.bad .bar span{background:var(--bad)}
.meter small{font-size:11.5px;color:var(--muted);min-width:34px;text-align:right}
.owner{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.owner i{width:20px;height:20px;border-radius:50%;background:var(--fg);color:var(--surface);font-family:var(--display);font-weight:700;font-size:11px;display:inline-flex;align-items:center;justify-content:center;letter-spacing:.04em}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:7px 12px;font-size:13px;font-weight:600;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(.92)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--surface-2)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.ro .w{display:none!important}

/* start */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:stretch}
.hero .card{padding:22px}
.hero .big{font-family:var(--display);font-weight:800;font-size:clamp(34px,5vw,56px);line-height:.92;text-transform:uppercase;margin:6px 0 10px}
.hero .big b{color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.tile span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.tile b{font-family:var(--body);font-weight:600;font-size:30px;line-height:1;letter-spacing:-.01em}
.ritme{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.week{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;cursor:pointer;border:1px solid transparent}
.week:hover{border-color:var(--line-strong)}
.week.cur{border-color:var(--accent)}
.week .n{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.16em;color:var(--muted)}
.week.cur .n{color:var(--accent)}
.week h3{font-size:22px;margin:4px 0 6px}
.week p{margin:0;font-size:12.5px;color:var(--muted)}
.agenda{display:flex;flex-direction:column}
.agenda>div{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.agenda>div:last-child{border-bottom:0}
.agenda p{margin:0}
.agenda b{font-family:var(--display);font-size:16px;letter-spacing:.06em;color:var(--accent)}
.agenda span{color:var(--muted);display:block;font-size:12.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.plain{white-space:pre-wrap;font-size:13.5px}

/* tables (planning, acties) */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line-strong)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.clk{cursor:pointer}.tbl tr.clk:hover td{background:var(--surface-2)}
.tbl tr.next td{background:var(--accent-soft)}
.tbl tr.past td{color:var(--muted)}
.tbl select{border:1px solid var(--line-strong);border-radius:6px;padding:3px 6px;background:var(--surface);font-size:12px;max-width:140px}
.scroll{overflow-x:auto;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:4px 8px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{border:1px solid var(--line-strong);border-radius:7px;padding:6px 9px;background:var(--surface);font-size:13px;min-width:0}
.filters input{min-width:160px}

/* modal */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.modal{background:var(--surface);color:var(--fg);width:min(680px,100%);border-radius:12px;box-shadow:var(--shadow-lift);padding:20px;display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto}
.modal h3{font-size:24px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{border:1px solid var(--line-strong);border-radius:7px;padding:8px 10px;background:var(--surface);width:100%}
.f textarea{min-height:72px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);outline:none}
.m-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.m-foot div{display:flex;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;z-index:60;box-shadow:var(--shadow-lift)}
.banner{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:16px}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.member{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.member .av{width:40px;height:40px;border-radius:50%;background:var(--fg);color:var(--surface);font-family:var(--display);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;flex:none;letter-spacing:.04em}
.member b{display:block;font-size:15px}.member small{color:var(--muted);display:block;font-size:12.5px}
.mx{display:inline-grid;grid-template-columns:auto auto;gap:3px 10px;font-size:11.5px;color:var(--muted)}
.mx b{color:var(--fg);font-weight:600}
@media (max-width:760px){
  .hero,.two{grid-template-columns:1fr}
  .wordmark{font-size:28px}
  .card.open{grid-column:auto}
  .grid{grid-template-columns:1fr}
  .qgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* agenda */
.ag-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ag-nav select{border:1px solid var(--line-strong);border-radius:7px;padding:7px 10px;background:var(--surface);font-size:13px;font-weight:600;max-width:100%}
.blocks{display:flex;flex-direction:column;gap:14px}
.block{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);display:grid;grid-template-columns:110px 1fr;min-width:0}
.block>.bt{padding:16px;border-right:1px solid var(--line)}
.block>.bt b{display:block;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.04em;color:var(--accent);line-height:1}
.block>.bt span{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:4px}
.block>.bb{padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.block h3{font-size:20px}
.ta{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 11px;background:var(--surface-2);min-height:64px;resize:vertical;line-height:1.5}
.ta:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.punt{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);flex-wrap:wrap;cursor:pointer}
.punt:hover{border-color:var(--line-strong)}
.punt .t{flex:1;min-width:200px}.punt .t small{display:block;color:var(--muted);font-size:12px}
.punt.klaar .t{text-decoration:line-through;color:var(--muted)}
.punt input[type=checkbox]{width:16px;height:16px;margin-top:3px;accent-color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted)}
.tbl tr.cancel td{color:var(--muted)}
.tbl tr.cancel .chip.theme{text-decoration:line-through}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--neutral)}
.live.on i{background:var(--good);box-shadow:0 0 0 3px var(--good-bg)}
.live.err i{background:var(--warn)}
.firsttask{font-size:12.5px;color:var(--muted);margin-top:6px}
.firsttask b{color:var(--fg);font-weight:500}
@media (max-width:760px){
  .block{grid-template-columns:1fr}
  .block>.bt{border-right:0;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:baseline;gap:10px}
  .block>.bt span{margin:0}
}
/* login (GitHub Pages mode) */
.login{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login .card{padding:28px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.login h2{font-size:30px}

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const todayISO = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const MAAND = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const DAG = ['zo','ma','di','wo','do','vr','za'];
function fmtDate(iso, withDay){
  if(!iso) return '';
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso); if(!m) return esc(iso);
  const d = new Date(+m[1], +m[2]-1, +m[3]);
  return (withDay ? DAG[d.getDay()]+' ' : '') + d.getDate()+' '+MAAND[d.getMonth()]+(withDay?'':' '+d.getFullYear());
}
function nlToISO(s){ s = String(s||'').trim(); if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10); const m = /^(\d{1,2})-(\d{1,2})-(\d{4})/.exec(s); return m ? `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}` : ''; }
function fmtVal(v, unit){
  if(v === null || v === undefined || v === '') return '–';
  const n = Number(v); if(isNaN(n)) return esc(v);
  if(unit === '%') return (Math.round(n*1000)/10).toLocaleString('nl-NL')+'%';
  return n.toLocaleString('nl-NL');
}
function initials(name){ return (name||'').split(/\s+/).filter(Boolean).slice(0,2).map(s=>s[0].toUpperCase()).join('') || '?'; }
function ownerHtml(name){ if(!name) return '<span class="owner"><i>?</i><span>geen eigenaar</span></span>'; return `<span class="owner"><i>${esc(initials(name))}</i><span>${esc(name)}</span></span>`; }
function pill(s){ if(!s) return ''; const t = TONE[s] ?? ''; return `<span class="pill ${t}"><i></i>${esc(s)}</span>`; }
function meter(p, tone){ if(p === null || p === undefined) return `<span class="meter"><span class="bar"><span style="width:0"></span></span><small>–</small></span>`; const pct = Math.round(p*100); return `<span class="meter ${tone||''}"><span class="bar"><span style="width:${pct}%"></span></span><small class="num">${pct}%</small></span>`; }
function teamNames(){ return sortBy(state.team, m=>num(m.order)??999).map(m=>m.naam).filter(Boolean); }
function sortBy(arr, f){ return [...arr].sort((a,b)=>{ const x=f(a), y=f(b); return x<y?-1:x>y?1:0; }); }
function byOrder(arr){ return sortBy(arr, a => [num(a.order) ?? 999, a.code||'', a.title||'']); }
function toast(msg){ const h = $('#toastHost'); h.innerHTML = `<div class="toast">${esc(msg)}</div>`; clearTimeout(h._t); h._t = setTimeout(()=>h.innerHTML='', 2600); }
const norm = s => String(s||'').toLowerCase().replace(/\s+/g,' ').trim();
const truthy = v => v === true || v === 'TRUE' || v === 'true' || v === 1 || v === '1';

function krWerkelijk(kr){
  const cur = KWARTALEN.indexOf(state.settings.kwartaal || 'Q4');
  for(let i = cur; i >= 0; i--){ const v = num(kr['q'+(i+1)+'w']); if(v !== null) return {v, q:KWARTALEN[i]}; }
  return null;
}
function krProgress(kr){
  const nul = num(kr.nulmeting), doel = num(kr.jaardoel), w = krWerkelijk(kr);
  if(nul === null || doel === null || !w || doel === nul) return null;
  return clamp((w.v - nul) / (doel - nul), 0, 1);
}
function okrStats(o){
  const krs = state.krs.filter(k => k.okr === o.id);
  const ps = krs.map(krProgress).filter(p => p !== null);
  const avg = ps.length ? ps.reduce((a,b)=>a+b,0)/ps.length : null;
  const counts = {}; krs.forEach(k => { counts[k.status||'Niet gestart'] = (counts[k.status||'Niet gestart']||0)+1; });
  const acties = state.acties.filter(a => a.okr === o.id || krs.some(k => k.id === a.kr));
  return {krs, avg, counts, measured: ps.length, acties};
}
function planItems(){ return sortBy(state.planning, m=>m.datum||''); }
function isCancelled(m){ return !!m && m.status === 'Vervallen'; }
function nextMeeting(){ const t = todayISO(); return planItems().find(m => m.datum >= t && !isCancelled(m)) || null; }
function themaByNaam(n){ return THEMAS.find(t => t.naam === n); }
function curAgendaDatum(){ if(state.agendaDatum && state.planning.some(m=>m.datum===state.agendaDatum)) return state.agendaDatum; const nm = nextMeeting(); return nm ? nm.datum : (planItems()[0]?.datum || null); }
function agendaDoc(datum){ return state.agenda.find(a => a.id === datum) || {id:datum, datum, checkin:'', afronding:'', volgende:''}; }
function punten(datum, blok){ return sortBy(state.agendapunten.filter(p => p.datum===datum && (p.blok||'punt')===blok), p => num(p.order) ?? 0); }
function addDays(iso, n){ const d = new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function isoWeek(iso){ const d = new Date(Date.UTC(+iso.slice(0,4), +iso.slice(5,7)-1, +iso.slice(8,10))); const day = d.getUTCDay()||7; d.setUTCDate(d.getUTCDate()+4-day); const y0 = new Date(Date.UTC(d.getUTCFullYear(),0,1)); return Math.ceil((((d-y0)/86400000)+1)/7); }
function weekStart(iso){ const d = new Date(iso+'T12:00:00'); const day = (d.getDay()+6)%7; d.setDate(d.getDate()-day); return d.toISOString().slice(0,10); }
function teamMembers(){ return sortBy(state.team.filter(m=>m.naam && m.naam!=='Hele team'), m=>num(m.order)??999); }
function absencesBetween(a, b){ return state.afwezigheid.filter(x => x.van && x.tot && x.van <= b && x.tot >= a); }
function weekendDatum(w){ return w.datum || (typeof liveFor==='function' && liveFor(w) ? liveFor(w).startdatum : '') || ''; }
function evalOpen(w){ const d = weekendDatum(w); return d && d < todayISO() && !w.evalDatum; }
function kpiLatest(k){ for(let i=12;i>=1;i--){ const v = num(k['m'+i]); if(v!==null) return {v, m:i}; } return null; }
function kpiStatus(k){ const l = kpiLatest(k); const norm = num(k.norm); if(!l) return 'Geen data'; if(norm===null) return ''; const hi = (k.direction||'Hoger is beter')==='Hoger is beter'; if(hi){ if(l.v >= norm) return 'Op norm'; if(l.v >= norm*0.9) return 'Aandacht'; return 'Onder norm'; } if(l.v <= norm) return 'Op norm'; if(l.v <= norm*1.1) return 'Aandacht'; return 'Onder norm'; }
function lookahead(days){
  const t = todayISO(), end = addDays(t, days||14); const items = [];
  planItems().filter(m => m.datum >= t && m.datum <= end).forEach(m => items.push({d:m.datum, type:'Meeting', tone:'accent', text:m.thema + (isCancelled(m)?' (vervallen)':''), action:'agenda', datum:m.datum}));
  state.weekenden.forEach(w => { const d = weekendDatum(w); if(d && d >= t && d <= end) items.push({d, type:'Weekend', tone:'good', text:w.title, sub:w.merk, tab:'weekenden', open:w.id}); });
  state.acties.filter(a => (a.status==='Open'||a.status==='Bezig') && a.deadline && a.deadline >= t && a.deadline <= end).forEach(a => items.push({d:a.deadline, type:'Deadline actie', tone:'', text:a.text, sub:a.owner, tab:'acties'}));
  state.mijlpalen.filter(m => m.status!=='Gereed' && m.deadline && m.deadline >= t && m.deadline <= end).forEach(m => { const p = state.projecten.find(x=>x.id===m.project); items.push({d:m.deadline, type:'Mijlpaal', tone:'busy', text:m.title, sub:p?p.title:'', tab:'projecten', open:m.project+','+m.id}); });
  absencesBetween(t, end).forEach(x => items.push({d: x.van < t ? t : x.van, type:'Afwezig', tone:'warn', text:x.naam, sub:(x.soort||'')+' · '+fmtDate(x.van)+' t/m '+fmtDate(x.tot), tab:'team'}));
  state.weekenden.filter(evalOpen).forEach(w => items.push({d:t, type:'Evaluatie open', tone:'warn', text:w.title, sub:'weekend was '+fmtDate(weekendDatum(w)), tab:'weekenden', open:w.id}));
  return sortBy(items, i => [i.d, i.type]);
}
function curWeekStart(){ return state.weekStart || weekStart(todayISO()); }
function weekDays(ws){ return [0,1,2,3,4].map(i => addDays(ws, i)); }
/* belvenster: in welk tijdvak en op welke dagen moet iemand de telefoon kunnen opnemen (Instellingen) */
function toMin(hhmm){ const m = /^(\d{1,2})[:.](\d{2})/.exec(String(hhmm||'')); return m ? Number(m[1])*60+Number(m[2]) : null; }
function fmtMin(x){ return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0'); }
function belVenster(){
  const s = state.settings || {};
  const m = /^(\d{1,2})[:.](\d{2})\s*[-–]\s*(\d{1,2})[:.](\d{2})$/.exec(String(s.telefoonVenster||'').trim());
  const van = m ? Number(m[1])*60+Number(m[2]) : 9*60, tot = m ? Number(m[3])*60+Number(m[4]) : 12*60;
  const dagen = String(s.telefoonDagen||'ma,di,wo,do').toLowerCase().split(/[,;\s]+/).map(x=>x.trim()).filter(x=>WEEKDAG_KEYS.includes(x));
  return {van: Math.min(van,tot), tot: Math.max(van,tot), dagen: dagen.length ? dagen : ['ma','di','wo','do'], label: fmtMin(Math.min(van,tot))+'–'+fmtMin(Math.max(van,tot))};
}
/* hele-dag-afspraken blokkeren het belvenster alleen als het echte afwezigheid is:
   Google's "Niet op kantoor" (kind 'ooo') of een titel met vakantie/verlof/vrije dag/afwezig.
   Werklocaties (Kantoor, Thuiswerken) en andere hele-dag-notities tellen niet als bezet. */
const AFWEZIG_RE = /vakantie|verlof|vrije dag|\bvrij\b|afwezig|out of office|\booo\b|niet op kantoor/i;
function blocksDay(e){ return !!e.allDay && !e.free && (e.kind==='ooo' || AFWEZIG_RE.test(e.title||'')); }
/* beschikbaarheid van één teamlid binnen het belvenster op dag d.
   ev = {ok, error, events} uit de agenda (of null), afw = afwezigheidsregels van die dag.
   → {st:'vrij'|'deels'|'bezet'|'afwezig'|'onbekend', slots:[[van,tot]], note} */
function belBeschikbaar(m, d, ev, afw, v){
  if(afw && afw.length) return {st:'afwezig', slots:[], note: afw[0].soort||'afwezig'};
  if(!m.email) return {st:'onbekend', slots:[], note:'geen agenda gekoppeld'};
  if(!ev || ev.ok===false) return {st:'onbekend', slots:[], note: ev && ev.error ? ev.error : 'agenda niet geladen'};
  const busy = [];
  for(const e of ev.events){
    if(e.free) continue;                                   // "beschikbaar" in Google Agenda telt niet als bezet
    if(e.allDay){ if(blocksDay(e)) busy.push([v.van, v.tot]); continue; }   // Kantoor/Thuiswerken e.d. blokkeren niet
    const a = toMin(e.start), b = toMin(e.end); if(a===null || b===null) continue;
    const s0 = Math.max(a, v.van), s1 = Math.min(b, v.tot); if(s1 > s0) busy.push([s0, s1]);
  }
  busy.sort((x,y)=>x[0]-y[0]);
  const slots = []; let cur = v.van;
  for(const [a,b] of busy){ if(a > cur) slots.push([cur, a]); cur = Math.max(cur, b); }
  if(cur < v.tot) slots.push([cur, v.tot]);
  const free = slots.reduce((n,[a,b])=>n+(b-a),0), total = v.tot - v.van;
  if(free >= total) return {st:'vrij', slots, note:''};
  if(free <= 0) return {st:'bezet', slots:[], note:''};
  return {st:'deels', slots: slots.filter(([a,b]) => b - a >= 30), note:''};   // blokjes korter dan 30 min tellen niet
}
function weekDoc(ws){ return state.weken.find(w => w.id===ws) || {id:ws, weekstart:ws, focus:'', afspraken:''}; }
function tabCount(id){ switch(id){ case 'okrs': return state.okrs.length; case 'weekenden': return state.weekenden.length; case 'projecten': return state.projecten.length; case 'brainstorm': return state.brainstorm.length; case 'acties': return state.acties.filter(a=>a.status==='Open'||a.status==='Bezig').length; case 'besluiten': return state.besluiten.length; case 'kpis': return state.kpis.filter(k=>['Onder norm','Aandacht'].includes(kpiStatus(k))).length; case 'agenda': { const d = curAgendaDatum(); return d ? punten(d,'punt').filter(p=>!truthy(p.klaar)).length : 0; } default: return 0; } }

/* themes shift when a meeting is cancelled: every later planned meeting takes the theme of the one before it.
   Returns the list of planning docs whose theme changed. */
function shiftThemes(items, fromDatum, direction){
  const sorted = sortBy(items.map(m=>({...m})), m=>m.datum);
  const idx = sorted.findIndex(m=>m.datum===fromDatum); if(idx<0) return [];
  const future = sorted.slice(idx).filter((m,i)=> i===0 || !isCancelled(m));
  const themes = future.map(m=>m.thema);
  if(direction>0){ for(let i=future.length-1;i>=1;i--) future[i].thema = themes[i-1]; }

}

/* ---------- render: weekenden (with live OPS Dashboard data) ---------- */
function liveRows(){ return state.live ? state.live.rows : []; }
function liveFor(w){ const n = norm(w.title); return liveRows().find(r => norm(r.project) === n) || null; }
function rWeekenden(){
  const t = todayISO();
  const ws = sortBy(state.weekenden.map(w => { const l = liveFor(w); return {...w, _live:l, _datum: (l && l.startdatum) || w.datum || ''}; }), w => [w._datum && w._datum >= t ? 0 : (w._datum ? 2 : 1), w._datum || '9999', w.title||'']);
  const unmatched = liveRows().filter(r => !state.weekenden.some(w => norm(w.title) === norm(r.project)));
  let liveLine;
  if(state.live) liveLine = `<span class="live on"><i></i>Live uit OPS Dashboard · sync ${esc(state.live.lastSync||'')}${state.live.storedAt?` · opgehaald ${new Date(state.live.storedAt).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})}`:''}</span>`;
  else if(state.liveError) liveLine = `<span class="live err"><i></i>${esc(liveErrorText(state.liveError))}</span>`;
  else if(state.ready && !store.liveAvailable()) liveLine = `<span class="live"><i></i>Geen live koppeling in deze weergave; je ziet de laatst opgeslagen cijfers.</span>`;
  else liveLine = `<span class="live"><i></i>Live gegevens ophalen…</span>`;

    <div class="sec-head"><div><span class="eyebrow">Thema 2 · Operationele voorbereiding</span><h2>Lopende weekenden</h2><p>Terugblik en vooruitblik op bezetting, risico's en besluiten. Voortgang, achterstallige taken en eerste open taak komen live uit het OPS Dashboard (Apps Script-sync van de productiesheets).</p><div style="margin-top:8px">${liveLine}</div></div>
    <div class="toolbar">${state.live&&state.canWrite?`<button class="btn w" data-action="liveSave" title="Schrijft de live cijfers in de opgeslagen kaarten, zodat ook wie geen koppeling heeft ze ziet">Live cijfers opslaan</button>`:''}<a class="btn" href="https://docs.google.com/spreadsheets/d/${esc(state.settings.opsDashboardId||OPS_SHEET_DEFAULT)}/edit" target="_blank" rel="noopener">OPS Dashboard ↗</a><button class="btn primary w" data-action="new" data-kind="weekend">+ Weekend</button></div></div>
    <div class="grid">${ws.length ? ws.map(w=>weekendCard(w,t)).join('') : `<div class="empty"><b>Nog geen weekenden</b>Voeg de lopende producties toe met status, bezetting en grootste risico.</div>`}</div>
    ${unmatched.length ? `<div class="layer" style="margin-top:8px"><div class="layer-h"><span class="eyebrow">In het OPS Dashboard, nog niet op de site · ${unmatched.length}</span></div><div class="acties">${unmatched.map(r=>`<div class="actie"><div class="t">${esc(r.project)}<small>${esc(r.merk)}${r.startdatum?' · start '+fmtDate(r.startdatum):''} · ${esc(r.voortgang)} · ${esc(r.achterstallig)} achterstallig</small></div><button class="btn sm w" data-action="liveAdd" data-project="${esc(r.project)}">+ Toevoegen</button></div>`).join('')}</div></div>` : ''}
  </div>`;
}
function liveErrorText(code){
  switch(code){
    case 'server_not_connected': return 'Geen live koppeling: voeg de connector Google Sheets toe in claude.ai (Instellingen → Connectors). Je ziet de laatst opgeslagen cijfers.';
    case 'needs_reauth': return 'Google Sheets opnieuw verbinden in claude.ai (Instellingen → Connectors) voor live cijfers.';
    case 'not_in_manifest': case 'blocked_by_policy': case 'consent_required': return 'Live koppeling niet toegestaan voor deze weergave; je ziet de laatst opgeslagen cijfers.';
    case 'approval_required': return 'Live koppeling wacht op jouw toestemming.';
    case 'tool_error': return 'Het OPS Dashboard kon niet gelezen worden (geen toegang tot het sheet?). Je ziet de laatst opgeslagen cijfers.';
    default: return 'Live cijfers tijdelijk niet beschikbaar; je ziet de laatst opgeslagen cijfers.';
  }
}

        <h3 class="disp">${esc(w.title)}</h3>
        <div class="meta" style="margin-top:8px">${w.status?pill(w.status):'<span class="chip">status instellen</span>'}${w.bezetting?`<span>Bezetting rond: <b>${esc(w.bezetting)}</b></span>`:''}${w.besluit==='Ja'?'<span class="pill accent"><i></i>besluit nodig</span>':''}${ownerHtml(w.owner)}</div>
        ${vg!==null?`<div style="margin-top:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">${meter(vg/100, l&&l.status?TONE[l.status]:'')}<span style="font-size:11.5px;color:var(--muted)">${l&&l.tekst?esc(l.tekst):'productiesheet'}${ach!==null?` · <b class="num" style="${ach>0?'color:var(--bad)':''}">${ach}</b> achterstallig`:''}${!l&&w.peildatum?` · peildatum ${fmtDate(w.peildatum)}`:''}</span></div>`:''}
        ${l&&l.eersteTaak?`<div class="firsttask">Eerste open taak: <b>${esc(l.eersteTaak)}</b>${l.eersteDeadline?` · ${fmtDate(l.eersteDeadline)}${num(l.dagenDeadline)!==null&&num(l.dagenDeadline)<0?` <span style="color:var(--bad)">(${Math.abs(num(l.dagenDeadline))} dagen te laat)</span>`:''}`:''}</div>`:''}
        ${!isOpen&&w.risico?`<p>Risico: ${esc(w.risico)}</p>`:''}
      </div>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
    </div>
    ${isOpen?`<div class="card-b">
      <div class="kv"><div><span>Grootste risico</span>${esc(w.risico||'–')}</div><div><span>Maatregel</span>${esc(w.maatregel||'–')}</div><div><span>Besluit nodig</span>${esc(w.besluit||'–')}${w.besluitTekst?': '+esc(w.besluitTekst):''}</div><div><span>Volgende stap</span>${esc(w.volgende||'–')}</div>${w.evaluatie?`<div style="grid-column:1/-1"><span>Evaluatie</span>${esc(w.evaluatie)}</div>`:''}${l&&l.fout?`<div style="grid-column:1/-1"><span>Foutmelding sync</span>${esc(l.fout)}</div>`:''}</div>
      ${(()=>{ const d = datum; if(!d) return ''; const afw = absencesBetween(addDays(d,-7), addDays(d,3)); return afw.length ? `<div class="meta"><span class="pill warn"><i></i>afwezig rond dit weekend</span>${afw.map(x=>`<span><b>${esc(x.naam)}</b> ${fmtDate(x.van)} t/m ${fmtDate(x.tot)}</span>`).join('')}</div>` : ''; })()}

function filterSel(name, opts, val, all){ return `<select data-filter="${name}"><option value="">${all}</option>${opts.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`; }
function rActies(){
  const f = state.filters; const t = todayISO();
  const owners = [...new Set(state.acties.map(a=>a.owner).filter(Boolean))].sort();
  let list = state.acties.filter(a => (!f.status || a.status===f.status) && (!f.thema || a.thema===f.thema) && (!f.owner || a.owner===f.owner) && (!f.q || (a.text+' '+(a.note||'')+' '+(a.code||'')).toLowerCase().includes(f.q.toLowerCase())));

/* ---------- werkdruk (check-in) ---------- */
function werkdrukBlock(datum){
  const members = teamMembers(); if(!members.length) return '';
  const scores = state.werkdruk.filter(x=>x.datum===datum);
  const avg = scores.length ? scores.reduce((a,x)=>a+Number(x.score||0),0)/scores.length : null;
  const dates = [...new Set(state.werkdruk.map(x=>x.datum))].filter(d=>d<=datum).sort().slice(-8);
  const trend = dates.map(d => { const xs = state.werkdruk.filter(x=>x.datum===d); return {d, v: xs.reduce((a,x)=>a+Number(x.score||0),0)/xs.length}; });
  const W = 150, H = 34, bw = 14, gap = 5;
  const spark = trend.length ? `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gemiddelde werkdruk laatste ${trend.length} meetings">${trend.map((p,i)=>{ const h = Math.max(2, Math.round((p.v/5)*(H-4))); const x = i*(bw+gap); return `<rect x="${x}" y="${H-h}" width="${bw}" height="${h}" rx="3" fill="${p.d===datum?'var(--accent)':'var(--line-strong)'}"><title>${fmtDate(p.d)}: ${p.v.toFixed(1)}</title></rect>`; }).join('')}</svg>` : '';
  return `<div class="layer" style="margin-top:4px"><div class="layer-h"><span class="eyebrow">Werkdruk deze week · 1 rustig, 5 te veel</span>${avg!==null?`<span class="chip">gem. <b class="num">${avg.toFixed(1)}</b></span>`:''}</div>
    <div class="acties">${members.map(m => { const sc = scores.find(x=>x.naam===m.naam); return `<div class="actie" style="align-items:center"><div class="t" style="min-width:140px">${esc(m.naam)}${sc&&sc.opmerking?`<small>${esc(sc.opmerking)}</small>`:''}</div><div class="score">${[1,2,3,4,5].map(n=>`<button class="sbtn ${sc&&Number(sc.score)===n?'on':''}" data-action="werkdruk" data-datum="${esc(datum)}" data-naam="${esc(m.naam)}" data-score="${n}" ${state.canWrite?'':'disabled'} aria-label="${esc(m.naam)} score ${n}">${n}</button>`).join('')}</div></div>`; }).join('')}</div>
    ${trend.length>1?`<div class="meta" style="align-items:flex-end">${spark}<span style="font-size:11.5px;color:var(--muted)">gemiddelde per meeting, laatste ${trend.length}</span></div>`:''}
  </div>`;
}

/* ---------- KPI's ---------- */
function kpiVal(k, m){ const v = num(k['m'+m]); if(v===null) return ''; return k.unit==='%' ? Math.round(v*1000)/10 : v; }
function rKpis(){
  const kp = sortBy(state.kpis, k=>[KPI_CATS.indexOf(k.categorie)<0?99:KPI_CATS.indexOf(k.categorie), num(k.nr)??999]);
  const cats = [...new Set(kp.map(k=>k.categorie||'Overig'))];
  const counts = {}; kp.forEach(k=>{ const st = kpiStatus(k)||'–'; counts[st]=(counts[st]||0)+1; });
  const curM = new Date().getMonth()+1;
  return `<div class="sec">
    <div class="sec-head"><div><span class="eyebrow">Basis op orde</span><h2>Operationele KPI's ${esc(state.settings.jaar||'')}</h2><p>Geen OKR's maar minimumnormen: dit hoort altijd te kloppen. Maandelijks invullen binnen 5 werkdagen na maandeinde (KR5.2). Status vergelijkt de laatst ingevulde maand met de norm.</p>
      <div class="meta" style="margin-top:8px">${['Op norm','Aandacht','Onder norm','Geen data'].filter(x=>counts[x]).map(x=>`<span class="pill ${TONE[x]||''}"><i></i>${counts[x]} ${esc(x.toLowerCase())}</span>`).join('')}</div></div>
    <div class="toolbar"><button class="btn primary w" data-action="new" data-kind="kpi">+ KPI</button></div></div>
    ${kp.length ? `<div class="scroll"><table class="tbl kpi"><thead><tr><th>#</th><th style="min-width:260px">KPI</th><th>Eigenaar</th><th>Norm</th><th>Status</th>${MAAND_KORT.map((m,i)=>`<th class="${i+1===curM?'cur':''}">${m}</th>`).join('')}<th></th></tr></thead><tbody>
      ${cats.map(c => `<tr class="grp"><td colspan="18">${esc(c)}</td></tr>` + kp.filter(k=>(k.categorie||'Overig')===c).map(k => { const st = kpiStatus(k); return `<tr>
        <td class="num" style="color:var(--muted)">${esc(k.nr||'')}</td><td>${esc(k.title)}<div style="font-size:11.5px;color:var(--muted)">${esc(k.direction||'')}${k.note?' · '+esc(k.note):''}</div></td><td>${esc(k.owner||'')}</td><td class="num" style="white-space:nowrap">${fmtVal(k.norm, k.unit)}</td><td>${pill(st)}</td>
        ${MAAND_KORT.map((m,i)=>`<td class="${i+1===curM?'cur':''}">${state.canWrite?`<input class="kpi-in" type="number" step="any" id="kpi-${esc(k.id)}-${i+1}" data-inline="kpi" data-id="${esc(k.id)}" data-m="${i+1}" value="${kpiVal(k,i+1)}" aria-label="${esc(k.title)} ${m}">`:`<span class="num">${fmtVal(k['m'+(i+1)],k.unit)}</span>`}</td>`).join('')}
        <td><button class="btn sm ghost w" data-action="edit" data-kind="kpi" data-id="${esc(k.id)}">Bewerk</button></td></tr>`; }).join('')).join('')}
    </tbody></table></div><p class="hint">Percentages als getal invullen (95 voor 95%). Eenheid en norm staan per KPI vast.</p>` : `<div class="empty"><b>Nog geen KPI's</b>Voeg de maandelijkse minimumnormen toe.</div>`}
  </div>`;
}

      ${members.map(m=>`<tr><td>${esc(m.naam)}</td>${weeks.map(w=>{ const we = addDays(w,6); const xs = state.afwezigheid.filter(x=>x.naam===m.naam && x.van && x.tot && x.van<=we && x.tot>=w); return `<td class="${xs.length?'afw-on':''} ${w===start?'cur':''}">${xs.map(x=>`<span class="afw-chip ${TONE[x.soort]||''}" data-action="edit" data-kind="afwezig" data-id="${esc(x.id)}" title="${esc(x.soort||'')} ${fmtDate(x.van)} t/m ${fmtDate(x.tot)}">${esc((x.soort||'').split(' ')[0])}</span>`).join('')}</td>`; }).join('')}</tr>`).join('')}

    ${list.length ? `<div class="acties">${list.map(x=>`<div class="actie"><div class="t">${esc(x.naam)}<small>${fmtDate(x.van)} t/m ${fmtDate(x.tot)}${x.note?' · '+esc(x.note):''}</small></div>${pill(x.soort)}<button class="btn sm ghost w" data-action="edit" data-kind="afwezig" data-id="${esc(x.id)}">Bewerk</button></div>`).join('')}</div>` : `<p class="hint">Geen afwezigheid gepland.</p>`}

/* ---------- week (maandag: weekplanning + telefoon) ---------- */
function evTitle(e){ return e.title || 'Bezet'; }
function rWeek(){
  const ws = curWeekStart(); const days = weekDays(ws); const t = todayISO(); const end = addDays(ws, 6);
  const members = teamMembers(); const wd = state.weekData[ws]; const loading = state.weekLoading === ws;
  const wk = weekDoc(ws);
  const evFor = (m, d) => { if(!wd || !wd.members) return null; const mm = wd.members.find(x => x.naam===m.naam || (m.email && x.email===m.email)); if(!mm) return null; return {ok:mm.ok, error:mm.error, events: (mm.events||[]).filter(e => e.d===d)}; };
  const afwFor = (m, d) => state.afwezigheid.filter(x => x.naam===m.naam && x.van && x.tot && x.van <= d && x.tot >= d);
  const thisWeek = { meetings: planItems().filter(m => m.datum >= ws && m.datum <= end), weekends: state.weekenden.filter(w => { const d = weekendDatum(w); return d && d >= ws && d <= addDays(end,2); }),
    deadlines: state.acties.filter(a => (a.status==='Open'||a.status==='Bezig') && a.deadline && a.deadline >= ws && a.deadline <= end), mijlpalen: state.mijlpalen.filter(m => m.status!=='Gereed' && m.deadline && m.deadline >= ws && m.deadline <= end), evals: state.weekenden.filter(evalOpen) };
  const ta = (field, ph) => `<textarea class="ta" id="wk-${field}" data-inline="week" data-field="${field}" data-ws="${esc(ws)}" placeholder="${esc(ph)}" ${state.canWrite?'':'readonly'}>${esc(wk[field]||'')}</textarea>`;
  const v = belVenster();
  const belRow = (d) => {
    const dagKey = WEEKDAG_KEYS[days.indexOf(d)];
    if(!v.dagen.includes(dagKey)) return `<span class="hint">geen belvenster</span>`;
    const rows = members.map(m => ({m, b: belBeschikbaar(m, d, evFor(m,d), afwFor(m,d), v)}));
    const vrij = rows.filter(r=>r.b.st==='vrij'), deels = rows.filter(r=>r.b.st==='deels'), bezet = rows.filter(r=>r.b.st==='bezet'), afw = rows.filter(r=>r.b.st==='afwezig'), onb = rows.filter(r=>r.b.st==='onbekend');
    if(store.weekAvailable() && !wd && loading) return `<span class="hint">agenda's ophalen…</span>`;
    const first = n => String(n||'').split(' ')[0];
    const nm = r => `<span class="bel-naam" title="${esc(r.m.naam)}">${esc(first(r.m.naam))}</span>`;
    const besch = [...vrij, ...deels];   // iedereen met minimaal een vrij blok in het venster
    return `<div class="bel">
      <div class="bel-l ok"><span class="bel-k">Kan</span>${besch.length ? besch.map(r => r.b.st==='vrij' ? nm(r) : `<span class="bel-naam part" title="${esc(r.m.naam)}: vrij ${r.b.slots.map(([a,b])=>fmtMin(a)+'–'+fmtMin(b)).join(', ')}">${esc(first(r.m.naam))} <small>${r.b.slots.map(([a,b])=>fmtMin(a)+'–'+fmtMin(b)).join(', ')}</small></span>`).join('') : '<span class="hint">niemand</span>'}</div>
      ${bezet.length || afw.length ? `<div class="bel-l no"><span class="bel-k">Niet</span>${bezet.map(nm).join('')}${afw.map(r=>`<span class="bel-naam" title="${esc(r.m.naam)}: ${esc(r.b.note)}">${esc(first(r.m.naam))} <small>${esc(r.b.note)}</small></span>`).join('')}</div>` : ''}
      ${onb.length ? `<div class="bel-l unk"><span class="bel-k">?</span>${onb.map(r=>`<span class="bel-naam" title="${esc(r.b.note)}">${esc(first(r.m.naam))}</span>`).join('')}</div>` : ''}

  }

async function deleteFromForm(btn){

    const writes = [{col:'planning', id: values.datum, del:true}];
    if(!isCancelled(values)) shiftThemes(state.planning, values.datum, 1).forEach(m => { if(m.datum!==values.datum) writes.push({col:'planning', id:m.datum, doc:{...m, updatedAt: nowISO()}}); });
    ok = await store.setMany(writes);

/* ---------- live data: OPS Dashboard projecten ('Projecten data' tab) ---------- */
function parseLive(values, storedAt){
  if(!Array.isArray(values) || values.length < 2) return null;
  const head = values[0].map(h => norm(h)); const col = n => head.indexOf(norm(n));
  const ci = {project:col('Project'), merk:col('Merk'), start:col('Startdatum'), dagen:col('Dagen tot start'), vg:col('Voortgang %'), tekst:col('C2 voortgang tekst'), ach:col('Achterstallige taken'), status:col('Status'), taak:col('Eerste open taak'), tdl:col('Deadline eerste open taak'), dd:col('Dagen tot deadline'), sync:col('Laatste sync'), fout:col('Foutmelding')};
  if(ci.project < 0) return null;
  const g = (r,i) => i>=0 ? (r[i] ?? '') : '';
  const rows = values.slice(1).filter(r => g(r,ci.project)).map(r => ({ project:String(g(r,ci.project)), merk:String(g(r,ci.merk)), startdatum:nlToISO(g(r,ci.start)), dagen:g(r,ci.dagen), voortgang:String(g(r,ci.vg)), tekst:String(g(r,ci.tekst)), achterstallig:g(r,ci.ach), status:String(g(r,ci.status)), eersteTaak:String(g(r,ci.taak)), eersteDeadline:nlToISO(g(r,ci.tdl)), dagenDeadline:g(r,ci.dd), sync:String(g(r,ci.sync)), fout:String(g(r,ci.fout)) }));
  return {rows, lastSync: rows.map(r=>r.sync).filter(Boolean).sort().pop() || '', storedAt};
}
function liveRows(){ return state.live ? state.live.rows : []; }
function liveFor(w){ const n = norm(w.title); return liveRows().find(r => norm(r.project) === n) || null; }
async function liveSave(){
  if(!state.live) return; const writes = [];
  for(const w of state.weekenden){ const l = liveFor(w); if(!l) continue;
    const vg = num(String(l.voortgang).replace('%','')), ach = num(l.achterstallig);
    const doc = {...w, voortgang: vg ?? w.voortgang ?? null, achterstallig: ach ?? w.achterstallig ?? null, datum: w.datum || l.startdatum || '', merk: w.merk || l.merk || '', peildatum: todayISO(), eersteTaak: l.eersteTaak||'', eersteDeadline: l.eersteDeadline||''};
    const a = {...w}, b = {...doc}; delete a.updatedAt; delete b.updatedAt;
    if(JSON.stringify(a) !== JSON.stringify(b)) writes.push({col:'weekenden', id:w.id, doc:{...doc, updatedAt: nowISO()}});
  }
  if(!writes.length){ toast('Alles was al actueel'); return; }
  if(await store.setMany(writes)) toast(`${writes.length} weekend${writes.length>1?'en':''} bijgewerkt met live cijfers`);
}

/* ---------- store: the artifact database (claude.ai) or the Apps Script API on the Google Sheet (GitHub Pages) ---------- */
const store = {
  db:null, mcp:null, liveUnsub:null, liveSheet:null, pollT:null, loadedOnce:false,
  async init(){
    if(window.claude && window.claude.use){
      const [db, user, mcp] = await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('mcp')]);
      if(db){ state.mode='db'; this.db=db; this.mcp=mcp;
        if(user){ try{ const cw = await user.can('data.write'); if(cw===false) state.canWrite=false; }catch(e){} }
        COLS.forEach(col => db.collection(col).onSnapshot(s => { state[col] = s.docs.filter(d=>d.exists).map(d=>({id:d.id, ...d.data()})); state.ready = true; rerender(); }, err => console.error(col, err)));
        db.doc('settings/main').onSnapshot(s => { if(s.exists) state.settings = {...state.settings, ...s.data()}; rerender(); this.liveStart(); }, err => console.error('settings', err));
        return;
      }
    }
    if(configured(CONFIG.apiUrl) && configured(CONFIG.clientId)){
      state.mode='api';
      try{ const t = sessionStorage.getItem('ops-auth'); if(t) state.auth = JSON.parse(t); }catch(e){}
      if(!state.auth || state.auth.exp*1000 < Date.now()+60000){ state.auth = null; state.loginNeeded = true; render(); return; }
      await this.loadAll(); this.startPolling();
      return;
    }
    state.ready = true; render();
  },
  /* ---- api mode ---- */
  async api(body){
    const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 45000); let res;
    try{ res = await fetch(CONFIG.apiUrl, {method:'POST', body: JSON.stringify({...body, token: state.auth && state.auth.token}), headers:{'Content-Type':'text/plain;charset=utf-8'}, redirect:'follow', signal: ctl.signal}); }
    catch(e){ clearTimeout(timer); throw new Error(e.name==='AbortError' ? 'geen antwoord van de API binnen 45 seconden. Apps Script is traag of de API_URL klopt niet.' : 'netwerkfout ('+e.message+'). Is de web-app gepubliceerd met toegang "Iedereen"?'); }
    clearTimeout(timer);
    const text = await res.text(); let j;
    try{ j = JSON.parse(text); }catch(e){ throw new Error('onverwacht antwoord (HTTP '+res.status+'): '+text.replace(/<style[\s\S]*?<\/style>|<script[\s\S]*?<\/script>/g,' ').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,200)); }
    if(j.error==='auth'){ state.auth=null; try{ sessionStorage.removeItem('ops-auth'); }catch(e){} state.loginNeeded=true; state.loginError='Je token is verlopen of niet geaccepteerd door het script. Log opnieuw in.'; render(); throw new Error('auth'); }
    if(j.error) throw new Error(j.error+(j.message?': '+j.message:''));
    return j;
  },
  applyAll(data){ COLS.forEach(col => { state[col] = (data[col]||[]).map(d => ({...d, id: String(d.id)})); }); if(data.settings) state.settings = {...state.settings, ...data.settings}; if(data.live){ const parsed = parseLive(data.live.values, Date.now()); if(parsed){ state.live = parsed; state.liveError = null; } else if(data.live.error){ state.liveError = 'tool_error'; state.liveErrorMsg = data.live.error; } } state.ready = true; rerender(); },
  async loadAll(){ state.loadError = ''; const slowT = setTimeout(() => { if(!state.ready){ state.slow = true; rerender(); } }, 12000);
    try{ const j = await this.api({op:'all', live: state.tab==='weekenden'}); if(!j || !j.data) throw new Error('leeg antwoord van de API'); this.applyAll(j.data); this.loadedOnce = true; state.slow = false; }
    catch(e){ if(e.message!=='auth'){ console.error(e); state.loadError = e.message; toast('Laden mislukt: '+e.message); state.ready = true; render(); } }
    finally{ clearTimeout(slowT); } },
  startPolling(){ clearInterval(this.pollT); this.pollT = setInterval(() => { if(document.visibilityState==='visible' && !modalState && !state.saving) this.loadAll(); }, 60000); document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible' && this.loadedOnce && !state.saving) this.loadAll(); }); },
  /* ---- writes ---- */
  async set(col, id, doc){ return this.setMany([{col, id, doc}]); },
  async remove(col, id){ return this.setMany([{col, id, del:true}]); },
  async setMany(writes){
    const clean = d => { const o = {}; Object.keys(d).forEach(k => { if(d[k]!==undefined) o[k]=d[k]; }); return o; };
    if(state.mode==='db'){
      try{ for(const w of writes){ const ref = this.db.collection(w.col).doc(w.id); if(w.del) await ref.delete(); else await ref.set(clean(w.doc)); } return true; }
      catch(e){ console.error(e); if(e && e.code==='invalid_argument'){ state.canWrite=false; toast('Je hebt geen schrijfrechten op deze pagina.'); rerender(); } else if(e && e.code==='quota_exceeded'){ toast('Opslag vol: '+e.message); } else toast('Opslaan mislukt: '+((e&&e.message)||e)); return false; }
    }
    if(state.mode==='api'){
      /* optimistic: apply locally now, send in the background (in order), refresh from the server only on failure */
      const payload = writes.map(w => w.del ? {col:w.col, id:w.id, del:true} : {col:w.col, id:w.id, doc:clean(w.doc)});
      payload.forEach(w => { const list = state[w.col] || (state[w.col] = []); const i = list.findIndex(x => x.id === w.id); if(w.del){ if(i >= 0) list.splice(i, 1); } else { const doc = {...w.doc, id: String(w.id)}; if(i >= 0) list[i] = doc; else list.push(doc); } });
      state.saving = (state.saving || 0) + 1; rerender();
      this.queue = (this.queue || Promise.resolve()).then(() => this.api({op:'write', writes: payload})).then(j => { if(j && j.data) this.applyAll(j.data); })
        .catch(e => { if(e.message !== 'auth'){ toast('Opslaan mislukt: ' + e.message + '. De pagina wordt ververst.'); this.loadAll(); } })
        .finally(() => { state.saving = Math.max(0, (state.saving || 1) - 1); rerender(); });
      return true;
    }
    toast('Geen verbinding met de gedeelde data.'); return false;
  },
  async setSettings(s){
    if(state.mode==='db'){ try{ await this.db.doc('settings/main').set(s); return true; }catch(e){ toast('Opslaan mislukt: '+((e&&e.message)||e)); return false; } }
    if(state.mode==='api'){ state.settings = {...state.settings, ...s}; rerender(); state.saving = (state.saving||0)+1; this.queue = (this.queue || Promise.resolve()).then(() => this.api({op:'settings', settings:s})).then(j => { if(j && j.data) this.applyAll(j.data); }).catch(e => { if(e.message!=='auth'){ toast('Opslaan mislukt: '+e.message); this.loadAll(); } }).finally(() => { state.saving = Math.max(0,(state.saving||1)-1); rerender(); }); return true; }
    return false;
  },
  /* ---- week: Google Agenda van het team (alleen via de Apps Script-API) ---- */
  weekAvailable(){ return state.mode==='api'; },
  async weekLoad(ws, force){
    if(state.mode!=='api') return; if(!force && state.weekData[ws] && Date.now() - (state.weekData[ws].fetchedAt||0) < 5*60000) return;
    if(state.weekLoading === ws) return; state.weekLoading = ws; rerender();
    try{ const j = await this.api({op:'week', from: ws, to: addDays(ws, 6)}); state.weekData[ws] = {...(j.data||{}), fetchedAt: Date.now()}; }
    catch(e){ if(e.message!=='auth') state.weekData[ws] = {error: e.message, fetchedAt: Date.now()}; }
    finally{ if(state.weekLoading === ws) state.weekLoading = null; rerender(); }
  },
  /* ---- live OPS Dashboard ---- */
  liveAvailable(){ return state.mode==='api' || (state.mode==='db' && !!this.mcp); },
  liveStart(){
    if(state.mode==='api'){ if(state.tab==='weekenden') this.loadAll(); return; }
    if(state.mode!=='db' || !this.mcp) return;
    const sheetId = state.settings.opsDashboardId || OPS_SHEET_DEFAULT; if(sheetId === this.liveSheet) return;
    if(this.liveUnsub){ this.liveUnsub(); } this.liveSheet = sheetId; state.live = null; state.liveError = null;
    this.liveUnsub = this.mcp.watchTool('Google Sheets', 'get_values', {spreadsheetId: sheetId, range: "'Projecten data'!A1:N120"}, ev => {
      if(ev.type==='data'){ const p = ev.result.payload; const parsed = parseLive(p && p.values, ev.result.cache ? ev.result.cache.storedAt : Date.now()); if(parsed){ state.live = parsed; state.liveError = null; } else state.liveError = 'tool_error'; }
      else { const c = ev.error.code; console.warn('live', ev.error); if(['needs_reauth','server_not_connected','blocked_by_policy','approval_required','not_in_manifest','consent_required','not_granted','capability_disabled','revoked'].includes(c)) state.live = null; state.liveError = c; }
      if(state.tab==='weekenden') rerender();
    }, {refetchInterval: 300000, cache:{staleTime: 60000}});
  }
};

/* ---------- login (api mode): Google Identity Services ---------- */
function mountLogin(){
  const el = document.getElementById('gsiBtn'); if(!el) return;
  const ready = () => { if(!window.google || !google.accounts){ return; }
    google.accounts.id.initialize({client_id: CONFIG.clientId, callback: onCredential, auto_select: true, hd: CONFIG.domain, ux_mode:'popup'});
    google.accounts.id.renderButton(el, {theme:'outline', size:'large', text:'signin_with', shape:'pill', locale:'nl'});
    google.accounts.id.prompt(); };
  if(window.google && google.accounts) ready();
  else if(!document.getElementById('gsi')){ const s = document.createElement('script'); s.id='gsi'; s.src='https://accounts.google.com/gsi/client'; s.async = true; s.onload = ready; document.head.appendChild(s); }
  else document.getElementById('gsi').addEventListener('load', ready);
}
async function onCredential(r){
  try{ const payload = JSON.parse(atob(r.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    const email = payload.email||''; if(!email.toLowerCase().endsWith('@'+CONFIG.domain)){ state.loginError = 'Alleen accounts van '+CONFIG.domain+' hebben toegang.'; render(); return; }
    state.auth = {token: r.credential, email, exp: payload.exp}; try{ sessionStorage.setItem('ops-auth', JSON.stringify(state.auth)); }catch(e){}
    state.loginNeeded = false; state.loginError = ''; render(); await store.loadAll(); store.startPolling();
  }catch(e){ state.loginError = 'Inloggen mislukt: '+e.message; render(); }
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]'); if(!el) return;

  if(a==='close'){ closeForm(); return; }
  if(a==='del'){ deleteFromForm(el); return; }
  if(a==='reload'){ state.ready = false; state.slow = false; render(); await store.loadAll(); return; }

  if(a==='goto'){ e.stopPropagation(); (el.dataset.open||'').split(',').filter(Boolean).forEach(id=>open.add(id)); setTab(el.dataset.tab); const last = (el.dataset.open||'').split(',').pop(); const target = last && document.getElementById('c-'+last); if(target) target.scrollIntoView({behavior:'smooth',block:'start'}); return; }

  if(a==='liveSave'){ el.disabled = true; await liveSave(); el.disabled = false; return; }
  if(a==='liveAdd'){ const r = liveRows().find(x=>x.project===el.dataset.project); if(!r) return; const id = uid('we'); const ok = await store.set('weekenden', id, {id, title:r.project, merk:r.merk||'', datum:r.startdatum||'', owner:'', status:'', bezetting:'', risico:'', maatregel:'', besluit:'', besluitTekst:'', volgende:'', evaluatie:'', voortgang:num(String(r.voortgang).replace('%','')), achterstallig:num(r.achterstallig), peildatum:todayISO(), eersteTaak:r.eersteTaak||'', eersteDeadline:r.eersteDeadline||'', createdAt:nowISO(), updatedAt:nowISO()}); if(ok) toast('Weekend toegevoegd'); return; }

    const doc = {...m, status: undo ? '' : 'Vervallen', updatedAt: nowISO()}; const writes = [{col:'planning', id:m.datum, doc}];
    const items = state.planning.map(x => x.datum===m.datum ? doc : x); shiftThemes(items, m.datum, undo ? -1 : 1).forEach(x => { if(x.datum!==m.datum) writes.push({col:'planning', id:x.datum, doc:{...x, updatedAt: nowISO()}}); });

  }
});
document.addEventListener('submit', e => { if(e.target.id==='mform'){ e.preventDefault(); saveForm(); } });
document.addEventListener('keydown', e => { if(e.key==='Escape' && modalState) closeForm(); });
document.addEventListener('change', async e => {
  const el = e.target;
  if(el.dataset.filter){ state.filters[el.dataset.filter] = el.value; rerender(); return; }
  if(el.dataset.inline==='agendaSel'){ state.agendaDatum = el.value; rerender(); return; }
  if(el.dataset.inline==='agenda'){ if(!state.canWrite) return; const ag = agendaDoc(el.dataset.datum); if((ag[el.dataset.field]||'') !== el.value){ const doc = {...ag, [el.dataset.field]: el.value, id: el.dataset.datum, datum: el.dataset.datum, updatedAt: nowISO()}; if(await store.set('agenda', el.dataset.datum, doc)) toast('Opgeslagen'); } return; }
  if(el.dataset.inline==='kpi'){ const k = state.kpis.find(x=>x.id===el.dataset.id); if(!k) return; let v = el.value===''?null:Number(String(el.value).replace(',','.')); if(v!==null && isNaN(v)) return; if(v!==null && k.unit==='%') v = Math.round(v*10000)/1000000; if(num(k['m'+el.dataset.m])===v) return; if(await store.set('kpis', k.id, {...k, ['m'+el.dataset.m]: v, updatedAt: nowISO()})) toast('KPI opgeslagen'); return; }
  if(el.dataset.inline==='week'){ if(!state.canWrite) return; const ws = el.dataset.ws; const w = weekDoc(ws); if((w[el.dataset.field]||'') !== el.value){ if(await store.set('weken', ws, {...w, [el.dataset.field]: el.value, id: ws, weekstart: ws, updatedAt: nowISO()})) toast('Opgeslagen'); } return; }
  if(el.dataset.inline==='puntKlaar'){ const p = state.agendapunten.find(x=>x.id===el.dataset.id); if(p) await store.set('agendapunten', p.id, {...p, klaar: el.checked, updatedAt: nowISO()}); return; }
  if(el.dataset.inline==='status'){ const col = el.dataset.kind==='besluit' ? 'besluiten' : 'acties'; const a = state[col].find(x=>x.id===el.dataset.id); if(!a) return; if(await store.set(col, a.id, {...a, status: el.value, updatedAt: nowISO()})) toast('Status: '+el.value); }
});
let qT; document.addEventListener('input', e => { const id = e.target.id; if(id==='fq' || id==='fbq'){ clearTimeout(qT); const v = e.target.value, key = e.target.dataset.filter; qT = setTimeout(()=>{ state.filters[key] = v; rerender(); const i = document.getElementById(id); if(i){ i.focus(); i.setSelectionRange(v.length, v.length); } }, 220); } });

/* ---------- boot ---------- */
(async function boot(){
  const h = (location.hash||'').slice(1); let saved=''; try{ saved = localStorage.getItem('ops-tab')||''; }catch(e){}
  state.tab = TABS.some(t=>t[0]===h) ? h : (TABS.some(t=>t[0]===saved) ? saved : 'start');
  render();
  await store.init();
  if(state.mode==='db' && state.tab==='weekenden') store.liveStart();
})();
</script>
